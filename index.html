<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Precios</title>
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Precios">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#DDE3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141B" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("precios.tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
:root{
  --shelf:#DDE3EA; --tag:#FFFFFF; --ink:#101828; --muted:#5B6575; --rule:#C9D1DB;
  --sticker:#FFD000; --sticker-ink:#1A1400;
  --good:#12805C; --good-s:#DDF3EA; --bad:#B42F25; --bad-s:#FBE3E0;
  --dot:#101828; --focus:#1F5FD6;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --shelf:#0F141B; --tag:#1A212B; --ink:#E8EDF3; --muted:#93A0B2; --rule:#2B3442;
    --good:#3FBF8A; --good-s:#11372A; --bad:#F06A5E; --bad-s:#3D1A17;
    --dot:#E8EDF3; --focus:#7FA8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --shelf:#0F141B; --tag:#1A212B; --ink:#E8EDF3; --muted:#93A0B2; --rule:#2B3442;
    --good:#3FBF8A; --good-s:#11372A; --bad:#F06A5E; --bad-s:#3D1A17;
    --dot:#E8EDF3; --focus:#7FA8FF;
    color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--shelf); color:var(--ink);
  font:17px/1.4 var(--body);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-tap-highlight-color:transparent;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.ico{flex:none;width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- marca ---------- */
.brand{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:56px;height:56px;border-radius:13px}

/* ---------- bloqueo ---------- */
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.lock form{width:min(380px,100%)}
.lock .brand{margin-bottom:10px}
.lock .logo{width:68px;height:68px;border-radius:15px}
.lock h1{font:800 clamp(3.4rem,14vw,5rem)/.9 var(--cond);margin:0;letter-spacing:-.01em}
.lock p{color:var(--muted);margin:0 0 22px}
.field{display:block;width:100%;padding:14px 16px;border:2px solid var(--rule);border-radius:16px;background:var(--tag);font-size:1.1rem}
.field:focus{border-color:var(--ink);outline:none}
.remember{display:flex;gap:10px;align-items:center;margin:14px 0 18px;color:var(--muted);font-size:.95rem}
.remember input{width:20px;height:20px;accent-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px 22px;background:var(--ink);color:var(--shelf);font-weight:600;cursor:pointer;min-height:48px}
.btn.wide{width:100%}
.err{color:var(--bad);font-weight:600;margin-top:12px;min-height:1.4em}

/* ---------- cabecera ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 64px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 14px}
header.top h1{font:800 clamp(2.8rem,8vw,4rem)/.85 var(--cond);margin:0;letter-spacing:-.01em}
header.top .meta{color:var(--muted);font-size:.92rem;margin-top:8px}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pref{display:flex;align-items:center;gap:4px;background:var(--tag);border-radius:16px;padding:6px 10px 6px 12px;font-size:.95rem;min-height:48px}
.pref label{color:var(--muted);margin-right:4px}
.pref input{width:52px;border:0;background:transparent;font:700 1.3rem var(--cond);text-align:right;padding:4px 2px}
.pref input:focus{outline:2px solid var(--focus);border-radius:6px}
.ghost{background:transparent;border:2px solid var(--rule);border-radius:16px;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:500;min-height:48px}
.theme{display:inline-grid;place-items:center;width:48px;padding:0;color:var(--ink)}
#prefsBtn{display:none}
.prefrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--shelf)}
.prefrow label{font-weight:600}
.prefrow label small{display:block;font-weight:400;color:var(--muted);font-size:.85rem}
.prefrow .in{display:flex;align-items:center;gap:6px}
.prefrow .in > span{width:1.2em}
.prefrow input{width:84px;padding:10px 12px;border:2px solid var(--rule);border-radius:14px;background:var(--tag);font:700 1.4rem var(--cond);text-align:right}
.prefrow input:focus{border-color:var(--ink);outline:none}
.sheet .ghost.wide{width:100%;margin-top:22px;display:flex;align-items:center;justify-content:center;gap:8px}
.spin .ico{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin .ico{animation:none}.spin{opacity:.5}}
.theme .ico{width:22px;height:22px}
.lock .theme{position:fixed;top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right))}

.searchbar{position:sticky;top:0;z-index:5;background:var(--shelf);padding:10px 0 10px;margin:0 -2px}
.search{position:relative}
.search > .ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);width:22px;height:22px;stroke-width:2.4}
.search input{width:100%;padding:16px 48px 16px 50px;border:2px solid transparent;border-radius:18px;background:var(--tag);font-size:1.15rem}
.search input:focus{border-color:var(--ink);outline:none}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:40px;height:40px;border-radius:999px;cursor:pointer;color:var(--muted);font-size:1.4rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:9px 16px 9px 13px;background:transparent;box-shadow:inset 0 0 0 2px var(--rule);cursor:pointer;font-weight:500;white-space:nowrap;min-height:44px}
.chip .c{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--shelf);box-shadow:none}
.chip[aria-pressed="true"] .c{color:inherit;opacity:.7}

/* ---------- secciones ---------- */
section.cat{margin-top:30px}
section.cat h2{font:800 2rem/1 var(--cond);margin:0 0 12px;display:flex;align-items:center;gap:10px}
section.cat h2 .ico{width:1.05em;height:1.05em;stroke-width:1.7}
section.cat h2 small{font:500 .95rem var(--body);color:var(--muted);align-self:flex-end;margin-bottom:.15em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}

/* etiqueta de estantería */
.tag{
  display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"info sticker" "buy sticker";
  column-gap:14px;align-items:start;text-align:left;border:0;cursor:pointer;
  background:var(--tag);border-radius:20px;padding:16px 16px 16px 18px;
}
.tag .info{grid-area:info}
.tag > .sticker{grid-area:sticker}
.tag > .buy{grid-area:buy}
.tag:active{transform:scale(.99)}
.tag .info{display:flex;flex-direction:column;gap:4px;min-width:0}
.tag .name{font:600 1.35rem/1.1 var(--cond)}
.tag .n{color:var(--muted);font-size:.85rem}
.tag > .buy{margin-top:10px}
.tag .asks{color:var(--muted);font-size:.85rem;margin-top:4px}

/* pegatina amarilla = precio de venta */
.sticker{
  position:relative;display:inline-block;background:var(--sticker);color:var(--sticker-ink);
  border-radius:14px;padding:9px 16px 9px 26px;min-width:140px;
}
.sticker::before{content:"";position:absolute;left:10px;top:50%;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:var(--shelf)}
.sticker .lbl{display:block;font-size:.8rem;font-weight:600}
.sticker b{font:800 2.5rem/1 var(--cond)}
.sticker.ask{background:transparent;box-shadow:inset 0 0 0 2px var(--sticker);color:var(--ink)}
.sticker.ask::before{background:var(--sticker)}

/* precio de compra, secundario */
.buy{text-align:left}
.buy .bl{display:block}
.buy .lbl{display:block;color:var(--muted);font-size:.8rem}
.buy b{font:700 1.55rem/1.05 var(--cond)}
.buy .roi{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.buy.none b{font-size:1.1rem;color:var(--muted)}

.empty{background:var(--tag);border-radius:20px;padding:26px 22px;margin-top:26px}
.empty h3{font:700 1.6rem/1.1 var(--cond);margin:0 0 6px}
.empty p{margin:0;color:var(--muted)}
footer{color:var(--muted);font-size:.88rem;margin-top:40px;max-width:70ch}
footer p{margin:0 0 6px}

/* ---------- detalle ---------- */
dialog{border:0;padding:0;background:var(--tag);color:var(--ink);max-width:none;max-height:none}
dialog::backdrop{background:rgba(8,12,18,.45)}
@media (min-width:760px){
  dialog{margin:0 0 0 auto;height:100%;width:min(480px,92vw);border-radius:28px 0 0 28px}
}
@media (max-width:759px){
  dialog{margin:auto 0 0;width:100%;max-height:92dvh;border-radius:28px 28px 0 0}
}
@media (prefers-reduced-motion:no-preference){
  dialog[open]{animation:in .22s ease-out}
  @keyframes in{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
}
.sheet{padding:20px 22px calc(28px + env(safe-area-inset-bottom))}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet .head p{margin:0;color:var(--muted);font-size:.92rem;display:flex;align-items:center;gap:6px}
.sheet h2{font:800 2.2rem/1 var(--cond);margin:4px 0 0}
.close{border:0;background:var(--shelf);border-radius:999px;width:44px;height:44px;flex:none;cursor:pointer;font-size:1.5rem;line-height:1}
.pair{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:22px 0 6px;flex-wrap:wrap-reverse}
.pair .sticker{min-width:180px}
.pair .sticker b{font-size:3.4rem}
.pair .buy b{font-size:2rem}
.pair .buy.none b{font-size:1.3rem}
.hint{color:var(--muted);font-size:.9rem;margin:10px 0 0}

.strip{margin:26px 0 4px}
.strip svg{display:block;width:100%;height:64px;overflow:visible}
.strip .axis{stroke:var(--rule);stroke-width:2;stroke-linecap:round}
.strip .dot{fill:var(--dot);stroke:var(--tag);stroke-width:2}
.strip .dot.ask{fill:var(--tag);stroke:var(--dot);stroke-width:2}
.strip .med{stroke:var(--ink);stroke-width:2}
.strip text{fill:var(--muted);font:500 13px var(--body)}
.strip text.medl{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;color:var(--muted);font-size:.85rem;margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:50%;background:var(--dot);display:inline-block}
.legend i.ask{background:transparent;box-shadow:inset 0 0 0 2px var(--dot)}

.calc{margin-top:24px;border-top:2px solid var(--shelf);padding-top:18px}
.calc label{display:block;font-weight:600;margin-bottom:8px}
.calc .row{display:flex;align-items:center;gap:10px}
.calc input{width:150px;padding:12px 14px;border:2px solid var(--rule);border-radius:14px;background:var(--tag);font:600 1.4rem var(--cond)}
.calc input:focus{border-color:var(--ink);outline:none}
.verdict{margin-top:12px;border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.verdict .ic{font-weight:800;font-size:1.2rem;line-height:1.2}
.verdict.ok{background:var(--good-s);color:var(--good)}
.verdict.no{background:var(--bad-s);color:var(--bad)}
.verdict b{font-family:var(--cond);font-size:1.25rem}
.verdict p{margin:2px 0 0;color:var(--ink);font-size:.92rem}

.sales{margin-top:26px}
.sales h3{font:700 1.3rem var(--cond);margin:0 0 6px}
.sales h3 small{font:400 .85rem var(--body);color:var(--muted);margin-left:6px}
.sales table{width:100%;border-collapse:collapse;font-size:.95rem}
.sales th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px 6px 0;border-bottom:2px solid var(--shelf)}
.sales td{padding:10px 8px 10px 0;border-bottom:1px solid var(--shelf);vertical-align:top}
.sales td.p{font:700 1.15rem var(--cond);text-align:right;white-space:nowrap;padding-right:0}
.sales th.p{text-align:right;padding-right:0}
.sales .note{display:block;color:var(--muted);font-size:.85rem;max-width:34ch}

@media (max-width:600px){
  .wrap{padding:14px 16px 64px}
  header.top{flex-wrap:nowrap;align-items:flex-start;margin:2px 0 6px}
  header.top h1{font-size:2.6rem}
  header.top .meta{font-size:.85rem;margin-top:10px}
  .brand{gap:11px}
  .logo{width:44px;height:44px;border-radius:11px}
  .tools{flex-wrap:nowrap;gap:8px}
  .tools .pref, #lockBtn{display:none}
  #prefsBtn{display:inline-grid}
  .searchbar{padding:12px 0 12px}
  .search input{padding:14px 44px 14px 46px;font-size:1.05rem}
  .search > .ico{left:15px;width:20px;height:20px}
  .chips{padding-top:14px}
  section.cat{margin-top:36px}
  section.cat h2{font-size:1.8rem;margin-bottom:14px}
  .grid{grid-template-columns:1fr;gap:14px}
  .tag{grid-template-areas:"info sticker" "buy buy";padding:18px 16px 16px 18px;border-radius:22px}
  .tag .info{gap:6px;padding-top:2px}
  .tag .name{font-size:1.4rem}
  .tag > .sticker{min-width:120px;padding:8px 14px 8px 24px}
  .tag > .sticker b{font-size:2.1rem}
  .tag > .buy{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;
    margin-top:16px;padding-top:14px;border-top:1.5px solid var(--shelf)}
  .tag > .buy .bl{display:flex;align-items:baseline;gap:8px}
  .tag > .buy .lbl{font-size:.85rem}
  .tag > .buy b{font-size:1.45rem}
  .tag > .buy .roi{margin:0}
  .tag > .buy.none b{font-size:1.05rem}
  .tag .asks{margin-top:0}
  .sheet{padding:22px 20px calc(30px + env(safe-area-inset-bottom))}
  .pair .sticker{min-width:150px}
  .pair .sticker b{font-size:2.9rem}
  footer{margin-top:48px}
}
</style>
</head>
<body>

<!-- Pantalla de contraseña -->
<main class="lock" id="lock" hidden>
  <button class="ghost theme" id="themeBtnLock" type="button"></button>
  <form id="lockForm" autocomplete="on">
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#101828"/><g transform="rotate(-14 32 32)"><path d="M5 32 17 16H56a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H17Z" fill="#FFD000"/><circle cx="17.5" cy="32" r="3.2" fill="#101828"/><text x="40" y="42.5" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="30" fill="#101828">€</text></g></svg><h1>Precios</h1></div>
    <p>Escribe la contraseña para ver las ventas.</p>
    <input type="text" name="username" value="precios" autocomplete="username" hidden>
    <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
    <label class="remember"><input type="checkbox" id="remember" checked> Recordar en este dispositivo</label>
    <button class="btn wide" id="enter" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

<!-- App -->
<div class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#101828"/><g transform="rotate(-14 32 32)"><path d="M5 32 17 16H56a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H17Z" fill="#FFD000"/><circle cx="17.5" cy="32" r="3.2" fill="#101828"/><text x="40" y="42.5" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="800" font-size="30" fill="#101828">€</text></g></svg><h1>Precios</h1></div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="tools">
      <div class="pref"><label for="gain">Ganar mínimo</label><input id="gain" data-pref="gain" class="num" type="number" inputmode="numeric" min="0" step="5"><span>€</span></div>
      <div class="pref"><label for="roi">ROI mínimo</label><input id="roi" data-pref="roi" class="num" type="number" inputmode="numeric" min="0" step="5"><span>%</span></div>
      <button class="ghost theme" id="refreshBtn" type="button" aria-label="Actualizar" title="Actualizar"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3.5V8h-4.5"/></svg></button>
      <button class="ghost theme" id="prefsBtn" type="button" aria-label="Ajustes" title="Ajustes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
      <button class="ghost theme" id="themeBtn" type="button"></button>
      <button class="ghost theme" id="lockBtn" type="button" aria-label="Bloquear" title="Bloquear"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg></button>
    </div>
  </header>

  <div class="searchbar">
    <div class="search">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 20 20"/></svg>
      <input id="q" type="search" placeholder="Busca un producto: ps5 slim, fr 255, iphone 13…" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Buscar producto">
      <button class="clear" id="clear" type="button" aria-label="Borrar búsqueda" hidden>×</button>
    </div>
    <nav class="chips" id="chips" aria-label="Categorías"></nav>
  </div>

  <div id="list"></div>
  <footer id="foot"></footer>
</div>

<dialog id="detail" aria-labelledby="dName"><div class="sheet" id="sheet"></div></dialog>

<dialog id="prefsDlg" aria-labelledby="pTitle"><div class="sheet">
  <div class="head"><div><p>Para calcular a cuánto comprar</p><h2 id="pTitle">Ajustes</h2></div>
    <button class="close" type="button" id="pClose" aria-label="Cerrar">×</button></div>
  <div class="prefrow"><label for="gainM">Ganar mínimo<small>Lo mínimo que quieres sacar por unidad</small></label>
    <span class="in"><input id="gainM" data-pref="gain" class="num" type="number" inputmode="numeric" min="0" step="5"><span>€</span></span></div>
  <div class="prefrow"><label for="roiM">ROI mínimo<small>Lo que ganas respecto a lo que pagas</small></label>
    <span class="in"><input id="roiM" data-pref="roi" class="num" type="number" inputmode="numeric" min="0" step="5"><span>%</span></span></div>
  <button class="ghost wide" id="lockBtnM" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg>Bloquear la app</button>
</div></dialog>

<script>
"use strict";
const $ = s => document.querySelector(s);
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const eur = n => Math.round(n).toLocaleString("es-ES") + " €";
const pct = n => Math.round(n) + " %";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fdate = iso => { if(!iso) return null; const [y,m,d] = iso.split("-").map(Number); return `${d} ${MESES[m-1]} ${y}`; };
const fdateLong = iso => { const [y,m,d] = iso.split("-").map(Number);
  return `${d} de ${["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"][m-1]} de ${y}`; };
const SRC = {lista:"Tu lista", ventas:"Grupo de ventas", wins:"Grupo de Wins", compras:"Grupo de compras", whatsapp:"WhatsApp"};

/* Pictogramas por categoría (24×24, trazo) */
const ICONS = {
  iphone: '<rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/><path d="M10.5 5h3"/>',
  samsung: '<rect x="6.5" y="2.5" width="11" height="19" rx="1.8"/><circle cx="12" cy="5.2" r=".9" fill="currentColor" stroke="none"/>',
  ipad: '<rect x="4.5" y="2.5" width="15" height="19" rx="2.4"/><circle cx="12" cy="4.9" r=".8" fill="currentColor" stroke="none"/>',
  ps5: '<path d="M10 3h4v18h-4z"/><path d="M10 4C6.5 5 5.2 8 5.2 12s1.3 7 4.8 8"/><path d="M14 4c3.5 1 4.8 4 4.8 8s-1.3 7-4.8 8"/>',
  switch: '<rect x="2.5" y="6.5" width="19" height="11" rx="3"/><path d="M7 6.5v11M17 6.5v11"/><circle cx="4.8" cy="10" r=".9" fill="currentColor" stroke="none"/><circle cx="19.2" cy="14" r=".9" fill="currentColor" stroke="none"/>',
  garmin: '<circle cx="12" cy="12" r="5.5"/><path d="M9.2 7.2 9.8 2.5h4.4l.6 4.7M9.2 16.8l.6 4.7h4.4l.6-4.7"/><path d="M17.5 12h1.3"/>',
  dji: '<rect x="9" y="10" width="6" height="11.5" rx="2"/><circle cx="12" cy="6" r="3.5"/><circle cx="12" cy="6" r="1.2"/>',
  quest: '<rect x="2.5" y="7.5" width="19" height="10" rx="4.5"/><path d="M10 17.5c.6-1.6 1.2-2.2 2-2.2s1.4.6 2 2.2"/>',
  rayban: '<rect x="2" y="9" width="8.5" height="6.5" rx="2.6"/><rect x="13.5" y="9" width="8.5" height="6.5" rx="2.6"/><path d="M10.5 11.4c1-.9 2-.9 3 0M2 10.6 1 8.2M22 10.6l1-2.4"/>',
  juegos: '<path d="M7 3h10v12.5l-2 2V21H9v-3.5l-2-2z"/><path d="M10 7h4M10 10h4"/>',
  retro: '<rect x="6" y="2.5" width="12" height="19" rx="2"/><rect x="8.5" y="5" width="7" height="6" rx=".8"/><path d="M8.8 16h3M10.3 14.5v3"/><circle cx="15" cy="15.2" r=".9" fill="currentColor" stroke="none"/>',
  zapatillas: '<path d="M2.5 16V10.5l3.5-1 2.2 2.8c2.2.5 4.3.2 6.3-.6l2 1.6 4 1.1c1.2.3 2 1.3 2 2.5v.1z"/><path d="M2.5 19h19"/><path d="M9.5 12.5l1-1.5M12 12.8l1-1.6"/>',
  _: '<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>'
};
const icon = c => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[(c && (c.icon || c.id))] || ICONS._}</svg>`;

let ENV = null, DATA = null, PRODUCTS = [], CATS = [];
const state = { cat: "all", q: "", gain: 40, roi: 20, open: null };
{ const g = parseInt(LS.get("precios.ganancia"), 10); if(!isNaN(g) && g >= 0) state.gain = g;
  const r = parseInt(LS.get("precios.roi"), 10); if(!isNaN(r) && r >= 0) state.roi = r; }

/* ---------- cifrado ---------- */
async function loadEnv(){
  const r = await fetch("data.enc.json", {cache:"no-store"});
  if(!r.ok) throw new Error("http " + r.status);
  ENV = await r.json();
}
async function deriveKey(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64d(ENV.salt), iterations:ENV.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
async function openWith(key){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(ENV.iv)}, key, b64d(ENV.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryStoredKey(){
  const raw = LS.get("precios.key");
  if(!raw) return null;
  try{
    const st = JSON.parse(raw);
    if(st.salt !== ENV.salt) return null;
    const key = await crypto.subtle.importKey("raw", b64d(st.k), {name:"AES-GCM"}, false, ["decrypt"]);
    return await openWith(key);
  }catch(e){ return null; }
}

/* ---------- datos ---------- */
function median(a){ const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
const isExp = s => s.kind === "esperada" || s.kind === "pide";
function build(){
  CATS = DATA.cats;
  const byP = {};
  DATA.sales.forEach((s,i) => (byP[s.p] = byP[s.p] || []).push({...s, i}));
  PRODUCTS = DATA.products.filter(p => byP[p.id]).map(p => {
    const all = byP[p.id].sort((a,b) => (b.date||"").localeCompare(a.date||"") || b.i - a.i);
    const sales = all.filter(s => !isExp(s)), exps = all.filter(isExp);
    const sp = sales.map(s => s.price), ep = exps.map(s => s.price);
    const dates = sales.map(s => s.date).filter(Boolean).sort();
    const cat = CATS.find(c => c.id === p.cat);
    const hay = norm([p.name, cat ? cat.name : "", ...(p.alias||[])].join(" "));
    const med = sp.length ? median(sp) : null, expMed = ep.length ? median(ep) : null;
    return { ...p, cat_: cat, sales, exps, n: sales.length,
      med, min: sp.length ? Math.min(...sp) : null, max: sp.length ? Math.max(...sp) : null,
      expMed, expMin: ep.length ? Math.min(...ep) : null, expMax: ep.length ? Math.max(...ep) : null,
      ref: med != null ? med : expMed, refIsExp: med == null,
      last: dates.length ? dates[dates.length-1] : null, hay, hayTight: hay.replace(/\s+/g,"") };
  });
}
/* Precio máximo de compra: el que cumple a la vez la ganancia mínima y el ROI mínimo.
   Si para eso habría que comprarlo por menos del 30 % de lo que se vende, no compensa. */
const MIN_BUY_SHARE = 0.3;
function buyInfo(sell){
  if(sell == null) return null;
  const byGain = sell - state.gain, byRoi = sell / (1 + state.roi/100);
  const buy = Math.floor(Math.min(byGain, byRoi));
  if(buy < sell * MIN_BUY_SHARE) return { buy: 0, none: true };
  const gain = sell - buy;
  return { buy, gain, roi: gain / buy * 100, limit: byGain <= byRoi ? "gain" : "roi" };
}
function matches(p){
  const toks = norm(state.q).split(/\s+/).filter(Boolean);
  return toks.every(t => p.hay.includes(t) || p.hayTight.includes(t));
}
const collator = new Intl.Collator("es", {numeric:true, sensitivity:"base"});
const ventas = n => `${n} ${n === 1 ? "venta" : "ventas"}`;
const esperadas = n => `${n} ${n === 1 ? "esperada" : "esperadas"}`;
const countTxt = (v, e) => [v ? ventas(v) : "", e ? esperadas(e) : ""].filter(Boolean).join(", ") || "sin datos";

/* ---------- pintar ---------- */
function renderChips(){
  const tot = {};
  PRODUCTS.forEach(p => tot[p.cat] = (tot[p.cat]||0) + p.n + p.exps.length);
  const all = [{id:"all", name:"Todo", c:DATA.sales.length}, ...CATS.filter(c => tot[c.id]).map(c => ({...c, c:tot[c.id]}))];
  $("#chips").innerHTML = all.map(c =>
    `<button class="chip" type="button" data-cat="${c.id}" aria-pressed="${state.cat===c.id}">${c.id === "all" ? "" : icon(c)}${esc(c.name)}<span class="c">${c.c}</span></button>`).join("");
}
function buyHTML(b, est){
  if(!b) return `<span class="buy none"><span class="bl"><span class="lbl">Comprar hasta</span><b>Sin datos</b></span></span>`;
  if(b.none) return `<span class="buy none"><span class="bl"><span class="lbl">Comprar hasta</span><b>No compensa</b></span></span>`;
  return `<span class="buy"><span class="bl"><span class="lbl">Comprar hasta</span><b class="num">${eur(b.buy)}</b></span><span class="roi">ganas ${eur(b.gain)}, ROI ${pct(b.roi)}${est ? ", según venta esperada" : ""}</span></span>`;
}
function stickerHTML(p, tag){
  return p.n
    ? `<${tag} class="sticker"><span class="lbl">Se vende</span><b class="num">${eur(p.med)}</b></${tag}>`
    : `<${tag} class="sticker ask"><span class="lbl">Venta esperada</span><b class="num">${eur(p.expMed)}</b></${tag}>`;
}
function tagHTML(p){
  const sub = p.n
    ? (p.n === 1 ? "1 venta" : p.min === p.max ? `${p.n} ventas, todas a ${eur(p.min)}` : `${p.n} ventas, de ${eur(p.min)} a ${eur(p.max)}`)
    : `Sin ventas aún, ${p.exps.length} ${p.exps.length === 1 ? "venta esperada" : "ventas esperadas"}`;
  const exps = p.exps.length && p.n
    ? `<span class="asks">${p.exps.length === 1 ? `Venta esperada ${eur(p.expMin)}` : p.expMin === p.expMax ? `${p.exps.length} ventas esperadas a ${eur(p.expMin)}` : `${p.exps.length} ventas esperadas, de ${eur(p.expMin)} a ${eur(p.expMax)}`}</span>` : "";
  return `<button class="tag" type="button" data-id="${p.id}">
    <span class="info"><span class="name">${esc(p.name)}</span><span class="n">${sub}</span>${exps}</span>
    ${stickerHTML(p, "span")}
    ${buyHTML(buyInfo(p.ref), p.refIsExp)}
  </button>`;
}
function render(){
  const list = $("#list");
  const shown = PRODUCTS.filter(p => (state.cat === "all" || p.cat === state.cat) && matches(p));
  if(!shown.length){
    list.innerHTML = `<div class="empty"><h3>Ninguna venta coincide con “${esc(state.q)}”</h3>
      <p>Prueba con menos palabras, por ejemplo solo el modelo. Si es un producto nuevo, aparecerá cuando entren ventas suyas.</p></div>`;
    return;
  }
  list.innerHTML = CATS.map(c => {
    const ps = shown.filter(p => p.cat === c.id).sort((a,b) => collator.compare(a.name, b.name));
    if(!ps.length) return "";
    const v = ps.reduce((t,p) => t + p.n, 0), e = ps.reduce((t,p) => t + p.exps.length, 0);
    return `<section class="cat" id="cat-${c.id}"><h2>${icon(c)}${esc(c.name)}<small>${countTxt(v, e)}</small></h2>
      <div class="grid">${ps.map(tagHTML).join("")}</div></section>`;
  }).join("");
}
function renderMeta(){
  const v = DATA.sales.filter(s => !isExp(s)).length, e = DATA.sales.length - v;
  $("#meta").textContent = `${ventas(v)} y ${e} ${e === 1 ? "venta esperada" : "ventas esperadas"}, actualizado el ${fdateLong(DATA.updated)}`;
  $("#foot").innerHTML = `<p>“Se vende” es la mediana de lo que se ha vendido de verdad en la comunidad. Las ventas esperadas (lo que alguien que acaba de comprarlo espera sacarle) salen aparte y no cuentan para ese precio; solo se usan cuando todavía no hay ventas.</p>
    <p>“Comprar hasta” es lo máximo que puedes pagar para ganar al menos ${eur(state.gain)} y un ROI del ${pct(state.roi)} a la vez.</p>`;
}

function stripSVG(p){
  const pts = [...p.sales.map(s => ({...s, e:false})), ...p.exps.map(s => ({...s, e:true}))];
  const prices = pts.map(s => s.price);
  const lo = Math.min(...prices), hi = Math.max(...prices);
  if(pts.length < 2 || lo === hi) return "";
  const W = 420, padL = 14, padR = 14, y = 26, span = hi - lo;
  const x = v => padL + (v - lo) / span * (W - padL - padR);
  const dots = pts.map(s => `<circle class="dot${s.e ? " ask" : ""}" cx="${x(s.price).toFixed(1)}" cy="${y}" r="7"><title>${s.e ? "Venta esperada" : "Vendido"} ${eur(s.price)}${s.date ? ", " + fdate(s.date) : ""}</title></circle>`).join("");
  const med = p.med != null && p.n >= 2 ? x(p.med) : null;
  return `<div class="strip"><svg viewBox="0 0 ${W} 64" role="img" aria-label="Precios de ${eur(lo)} a ${eur(hi)}">
    <line class="axis" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/>
    ${med != null ? `<line class="med" x1="${med}" x2="${med}" y1="${y-15}" y2="${y+15}"/>` : ""}
    ${dots}
    <text x="${padL}" y="${y+34}">${eur(lo)}</text>
    <text x="${W-padR}" y="${y+34}" text-anchor="end">${eur(hi)}</text>
    ${med != null ? `<text class="medl" x="${Math.min(Math.max(med, padL+60), W-padR-60)}" y="${y-20}" text-anchor="middle">mediana ${eur(p.med)}</text>` : ""}
  </svg>${p.exps.length && p.n ? `<div class="legend"><span><i></i>Vendido</span><span><i class="ask"></i>Venta esperada</span></div>` : ""}</div>`;
}
const fd = s => s.date ? fdate(s.date) : "Sin fecha";
const noteHTML = s => {
  const bits = [SRC[s.src] || esc(s.src || "")];
  if(s.buy != null && !isExp(s)) bits.push(`compró a ${eur(s.buy)}`);
  return `${bits.join(", ")}${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}`;
};
function salesTable(list){
  return `<table><thead><tr><th>Fecha</th><th>Origen</th><th class="p">Precio</th></tr></thead><tbody>${
    list.map(s => `<tr><td>${fd(s)}</td><td>${noteHTML(s)}</td><td class="p num">${eur(s.price)}</td></tr>`).join("")}</tbody></table>`;
}
function expsTable(list){
  return `<table><thead><tr><th>Fecha</th><th class="p">Compra</th><th class="p">Esperada</th></tr></thead><tbody>${
    list.map(s => `<tr><td>${fd(s)}${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}</td>
      <td class="p num">${s.buy != null ? eur(s.buy) : "–"}</td><td class="p num">${eur(s.price)}</td></tr>`).join("")}</tbody></table>`;
}
function openDetail(id){
  const p = PRODUCTS.find(x => x.id === id); if(!p) return;
  state.open = id;
  const b = buyInfo(p.ref);
  let hint;
  if(!p.n) hint = `Todavía no hay ventas cerradas. El precio es la mediana de ${p.exps.length === 1 ? "la venta esperada" : `las ${p.exps.length} ventas esperadas`}: tómalo como orientativo.`;
  else hint = p.n === 1 ? "Solo hay una venta: tómalo como orientativo." : p.n === 2 ? "Con dos ventas, la mediana es la media de las dos." : `Mediana de ${p.n} ventas.`;
  if(b && b.none) hint += ` Para ganar tus ${eur(state.gain)} tendrías que comprarlo casi regalado, por eso sale “No compensa”.`;
  else if(b) hint += b.limit === "gain" ? ` El tope de compra lo marca tu ganancia mínima de ${eur(state.gain)}.` : ` El tope de compra lo marca tu ROI mínimo del ${pct(state.roi)}.`;
  $("#sheet").innerHTML = `
    <div class="head"><div><p>${icon(p.cat_)}${esc(p.cat_ ? p.cat_.name : "")}</p><h2 id="dName">${esc(p.name)}</h2></div>
      <button class="close" type="button" id="dClose" aria-label="Cerrar">×</button></div>
    <div class="pair">${buyHTML(b, p.refIsExp)}${stickerHTML(p, "div")}</div>
    <p class="hint">${hint}</p>
    ${stripSVG(p)}
    <div class="calc">
      <label for="offer">¿Te lo ofrecen? Pon el precio</label>
      <div class="row"><input id="offer" class="num" type="number" inputmode="numeric" min="0" placeholder="0"><span>€</span></div>
      <div id="verdict" aria-live="polite"></div>
    </div>
    ${p.n ? `<div class="sales"><h3>${p.n === 1 ? "La venta" : `Las ${p.n} ventas`}</h3>${salesTable(p.sales)}</div>` : ""}
    ${p.exps.length ? `<div class="sales"><h3>${p.exps.length === 1 ? "Venta esperada" : `${p.exps.length} ventas esperadas`}<small>lo que esperan sacarle quienes lo han comprado</small></h3>${expsTable(p.exps)}</div>` : ""}`;
  $("#dClose").onclick = () => $("#detail").close();
  $("#offer").oninput = e => verdict(p, e.target.value);
  const d = $("#detail");
  if(!d.open) d.showModal();
}
function verdict(p, v){
  const el = $("#verdict"), offer = parseFloat(v);
  if(!v || isNaN(offer) || offer <= 0){ el.innerHTML = ""; return; }
  const sell = p.ref, gain = sell - offer, roi = gain / offer * 100;
  const okGain = gain >= state.gain, okRoi = roi >= state.roi, ok = okGain && okRoi;
  const at = `Vendiéndolo a ${eur(sell)}${p.refIsExp ? " (venta esperada)" : ""}`;
  let why;
  if(gain < 0) why = `${at} perderías ${eur(-gain)}.`;
  else if(ok) why = `${at} ganarías ${eur(gain)}, un ROI del ${pct(roi)}.`;
  else {
    const fails = [];
    if(!okGain) fails.push(`ganarías ${eur(gain)} y tu mínimo es ${eur(state.gain)}`);
    if(!okRoi) fails.push(`el ROI sería del ${pct(roi)} y tu mínimo es del ${pct(state.roi)}`);
    why = `${at}, ${fails.join(", y ")}.`;
  }
  el.innerHTML = `<div class="verdict ${ok ? "ok" : "no"}"><span class="ic" aria-hidden="true">${ok ? "✓" : "✗"}</span>
    <div><b>${ok ? "Compensa" : "No compensa"}</b><p>${why}</p></div></div>`;
}

/* ---------- eventos ---------- */
function wire(){
  $("#chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    state.cat = b.dataset.cat; renderChips(); render();
    window.scrollTo({top:0, behavior:"smooth"});
  });
  $("#q").addEventListener("input", e => {
    state.q = e.target.value; $("#clear").hidden = !state.q;
    if(state.q && state.cat !== "all"){ state.cat = "all"; renderChips(); }
    render();
  });
  $("#clear").onclick = () => { $("#q").value = ""; state.q = ""; $("#clear").hidden = true; render(); $("#q").focus(); };
  $("#list").addEventListener("click", e => { const t = e.target.closest(".tag"); if(t) openDetail(t.dataset.id); });
  const PREF_KEYS = {gain:"precios.ganancia", roi:"precios.roi"};
  document.querySelectorAll("[data-pref]").forEach(el => {
    const k = el.dataset.pref; el.value = state[k];
    el.addEventListener("input", () => {
      const v = parseInt(el.value, 10); if(isNaN(v) || v < 0) return;
      state[k] = v; LS.set(PREF_KEYS[k], String(v));
      document.querySelectorAll(`[data-pref="${k}"]`).forEach(o => { if(o !== el) o.value = v; });
      render(); renderMeta();
      if($("#detail").open && state.open) openDetail(state.open);
    });
  });
  $("#prefsBtn").onclick = () => $("#prefsDlg").showModal();
  $("#pClose").onclick = () => $("#prefsDlg").close();
  $("#prefsDlg").addEventListener("click", e => { if(e.target === $("#prefsDlg")) $("#prefsDlg").close(); });
  $("#lockBtnM").onclick = () => { LS.del("precios.key"); location.reload(); };
  if(window.matchMedia && matchMedia("(max-width:600px)").matches) $("#q").placeholder = "Busca: ps5 slim, iphone 13…";
  $("#detail").addEventListener("click", e => { if(e.target === $("#detail")) $("#detail").close(); });
  $("#lockBtn").onclick = () => { LS.del("precios.key"); location.reload(); };
  $("#refreshBtn").onclick = async () => {
    const b = $("#refreshBtn"); if(b.classList.contains("spin")) return;
    b.classList.add("spin"); b.setAttribute("aria-label", "Actualizando…");
    try{ const r = await navigator.serviceWorker?.getRegistration(); await r?.update(); }catch(e){}
    location.reload();
  };
}

/* ---------- tema claro / oscuro ---------- */
const SUN = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
const MOON = '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const sysDark = () => window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
const curTheme = () => document.documentElement.dataset.theme || (sysDark() ? "dark" : "light");
function paintTheme(){
  const dark = curTheme() === "dark";
  document.querySelectorAll("#themeBtn, #themeBtnLock").forEach(b => {
    b.innerHTML = dark ? SUN : MOON;
    b.setAttribute("aria-label", dark ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
    b.title = b.getAttribute("aria-label");
  });
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => m.content = dark ? "#0F141B" : "#DDE3EA");
}
function toggleTheme(){
  const next = curTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next; LS.set("precios.tema", next); paintTheme();
}
document.querySelectorAll("#themeBtn, #themeBtnLock").forEach(b => b.addEventListener("click", toggleTheme));
paintTheme();

function showApp(){
  build(); renderMeta(); renderChips(); render(); wire();
  $("#lock").hidden = true; $("#app").hidden = false;
}
function showLock(msg){
  $("#app").hidden = true; $("#lock").hidden = false;
  if(msg) $("#err").textContent = msg;
  $("#pw").focus();
}

$("#lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#enter"); btn.disabled = true; btn.textContent = "Comprobando…"; $("#err").textContent = "";
  try{
    const key = await deriveKey($("#pw").value);
    DATA = await openWith(key);
    if($("#remember").checked) LS.set("precios.key", JSON.stringify({salt:ENV.salt, k:b64e(await crypto.subtle.exportKey("raw", key))}));
    showApp();
  }catch(err){
    $("#err").textContent = "Contraseña incorrecta.";
    btn.disabled = false; btn.textContent = "Entrar"; $("#pw").select();
  }
});

(async function start(){
  try{ await loadEnv(); }
  catch(e){ showLock("No se han podido cargar los datos. Comprueba la conexión y vuelve a abrir la app."); $("#enter").disabled = true; return; }
  const d = await tryStoredKey();
  if(d){ DATA = d; showApp(); } else { showLock(); }
})();

if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
